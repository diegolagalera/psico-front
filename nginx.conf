server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para carga ultrarrápida
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Caché larga para assets compilados con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Soporte SPA para Vue Router (evita 404 al recargar /login, /dashboard, /admin, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
