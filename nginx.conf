server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para carga ultrarrápida
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Caché larga para assets compilados con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sitemap XML dinámico generado desde MySQL en el backend
    location = /sitemap.xml {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carlaviladotpsicologia.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host api.carlaviladotpsicologia.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $sitemap_upstream https://api.carlaviladotpsicologia.com/api/seo/sitemap.xml;
        proxy_pass $sitemap_upstream;
    }

    # Previsualización Open Graph y SEO dinámico para recursos gratuitos (/recursos/:slug)
    # 1) Los crawlers sin ejecución de JS (redes sociales: Instagram DM, WhatsApp, Meta, X, LinkedIn, Telegram y bots de IA)
    #    reciben el HTML semántico con el título SEO, descripción, JSON-LD Article y foto de portada del recurso desde el backend.
    # 2) Navegadores y Googlebot/Bingbot (que ejecutan Chromium + miden Core Web Vitals y CSS móvil) reciben el SPA completo
    #    con canonical, og:url y og:image inyectados desde el primer byte + hidratación completa con useSeo.js.
    location ~ ^/recursos/(?<resource_slug>[^/]+)/?$ {
        error_page 418 = @og_resource_bot;

        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Meta-ExternalAgent|Meta-ExternalFetcher|WhatsApp|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|Pinterest|SkypeUriPreview|Applebot|GPTBot|ChatGPT-User|PerplexityBot|ClaudeBot)") {
            return 418;
        }

        sub_filter_once off;
        sub_filter '<link rel="canonical" href="https://www.carlaviladotpsicologia.com/" />' '<link rel="canonical" href="https://www.carlaviladotpsicologia.com/recursos/$resource_slug" />';
        sub_filter '<meta property="og:url" content="https://www.carlaviladotpsicologia.com/" />' '<meta property="og:url" content="https://www.carlaviladotpsicologia.com/recursos/$resource_slug" />';
        sub_filter 'https://www.carlaviladotpsicologia.com/images/carla-viladot.jpg' 'https://api.carlaviladotpsicologia.com/api/og/resources/$resource_slug/cover.jpg';
        rewrite ^ /index.html break;
    }

    location @og_resource_bot {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_ssl_server_name on;
        proxy_set_header Host api.carlaviladotpsicologia.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host api.carlaviladotpsicologia.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $og_upstream https://api.carlaviladotpsicologia.com/api/og/resources/$resource_slug;
        proxy_pass $og_upstream;
    }

    # Inyección en servidor de canonical, og:url y metadatos exactos para el Hub de Recursos (/recursos)
    location ~ ^/recursos/?$ {
        sub_filter_once off;
        sub_filter '<title>Vuelve a Ti · Terapia Ruptura de Pareja | Carla Viladot</title>' '<title>Recursos Gratuitos Ruptura de Pareja | Carla Viladot</title>';
        sub_filter '<meta property="og:title" content="Vuelve a Ti · Terapia Ruptura de Pareja | Carla Viladot" />' '<meta property="og:title" content="Recursos Gratuitos Ruptura de Pareja | Carla Viladot" />';
        sub_filter '<link rel="canonical" href="https://www.carlaviladotpsicologia.com/" />' '<link rel="canonical" href="https://www.carlaviladotpsicologia.com/recursos" />';
        sub_filter '<meta property="og:url" content="https://www.carlaviladotpsicologia.com/" />' '<meta property="og:url" content="https://www.carlaviladotpsicologia.com/recursos" />';
        rewrite ^ /index.html break;
    }

    # Inyección en servidor de canonical y og:url exactos para páginas legales (/aviso-legal, /privacidad, /cookies)
    location ~ ^/(?<legal_page>aviso-legal|privacidad|cookies)/?$ {
        sub_filter_once off;
        sub_filter '<link rel="canonical" href="https://www.carlaviladotpsicologia.com/" />' '<link rel="canonical" href="https://www.carlaviladotpsicologia.com/$legal_page" />';
        sub_filter '<meta property="og:url" content="https://www.carlaviladotpsicologia.com/" />' '<meta property="og:url" content="https://www.carlaviladotpsicologia.com/$legal_page" />';
        rewrite ^ /index.html break;
    }

    # Rutas privadas de alumnos y administración (marcadas noindex desde la cabecera HTTP y el primer byte HTML)
    location ~ ^/(login|dashboard|admin)(/.*)?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        sub_filter_once off;
        sub_filter '<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />' '<meta name="robots" content="noindex, nofollow" />';
        rewrite ^ /index.html break;
    }

    # Soporte SPA para Vue Router (Landing principal y rutas restantes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
